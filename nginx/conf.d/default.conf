map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

server {
    listen 80;
    server_name _;

    # Forward /sanctum and /api to Laravel backend (PHP-FPM)
    location ~ ^/(api|sanctum) {
        root /var/www/html/public;

        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;

        fastcgi_param HTTP_X_REQUEST_ID $req_id;

        add_header X-Request-ID $req_id always;
    }

    # Root: placeholder for future frontend
    location / {
        return 200 '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Rental House Platform</title></head><body><h1>Rental House Platform</h1><p>Frontend coming soon. API available at <a href="/api/v1/ping">/api/v1/ping</a>.</p></body></html>';
        add_header Content-Type text/html;
        add_header X-Request-ID $req_id always;
    }
}
