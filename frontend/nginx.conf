# TROSV SPA - server {} context is provided by nginx's main config
# (conf.d/app.conf is included inside http {}).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers (API responses get theirs from Laravel) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # HSTS only matters once TLS terminates in front; harmless on plain HTTP
    # in dev. Keep max-age modest until the deployment is stable.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # ---- Hashed assets: immutable, cache forever ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- Leaflet images: not hashed, cache moderately ----
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---- SPA fallback: every route serves index.html ----
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell - it references the hashed assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
